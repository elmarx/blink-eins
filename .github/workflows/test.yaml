name: test

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Check compilation
        run: cargo check --workspace --locked
      - name: Check compilation (blink-one with commands feature)
        run: cargo check -p blink-one --locked --features commands
      - name: Run tests
        run: cargo nextest run --workspace --locked --no-tests=warn
      - name: Run tests (blink-one with commands feature)
        run: cargo nextest run -p blink-one --locked --no-tests=warn --features commands
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint (blink-one with commands feature)
        run: cargo clippy -p blink-one --features commands --all-targets -- -D warnings
      - name: Lint pedantic
        run: cargo clippy --workspace --all-targets -- -D clippy::pedantic
      - name: Lint pedantic (blink-one with commands feature)
        run: cargo clippy -p blink-one --features commands --all-targets -- -D clippy::pedantic
